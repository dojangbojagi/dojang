[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "prague"
chain_id = 91342
optimizer = true
optimizer_runs = 200
remappings = ["@openzeppelin/contracts/=../node_modules/@openzeppelin/contracts/"]
fs_permissions = [
    { access = "read", path = "../circuits/testdata" },
    { access = "read", path = "out" }
]

